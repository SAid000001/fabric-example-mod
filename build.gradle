plugins {
    id 'fabric-loom' version '1.3-SNAPSHOT'
    id 'maven-publish'
}

// Автоматическое чтение из gradle.properties
version = project.mod_version
group = project.maven_group

// Проверка переменных (добавьте этот блок)
afterEvaluate {
    println "=== Конфигурация сборки ==="
    println "Minecraft: ${project.minecraft_version}"
    println "Yarn mappings: ${project.yarn_mappings}"
    println "Fabric Loader: ${project.loader_version}"
    println "Fabric API: ${project.fabric_version}"
    println "Group: ${project.maven_group}"
    println "Version: ${project.mod_version}"
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
